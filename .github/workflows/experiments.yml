name: VM Placement Experiments (Bin Packing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_htafm:
        description: 'Run H‑TAFM experiments (Cut, Entropy, Hierarchical)'
        type: boolean
        default: true

jobs:
  # ============================================================
  # BASELINE EXPERIMENTS (6 policies in parallel)
  # ============================================================
  run-baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy:
          - FGD
          - BestFit
          - DotProduct
          - GpuPacking
          - GpuClustering
          - Random
      fail-fast: false

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('simulator/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Clone and build simulator
        run: |
          git clone https://github.com/hkust-adsl/kubernetes-scheduler-simulator.git simulator
          cd simulator
          go mod vendor
          make
          chmod +x bin/simon

      - name: Install Python dependencies (simulator)
        run: |
          cd simulator
          pip install -r requirements.txt

      - name: Prepare trace data (CSV to YAML)
        run: |
          cd simulator/data
          if [ ! -f csv/openb_pod_list_gpushare40.csv ]; then
            mkdir -p csv
            wget -P csv/ https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_node_list_gpu_node.csv
            wget -P csv/ https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_pod_list_gpushare40.csv
          fi
          chmod +x prepare_input.sh
          sed -i 's/python /python3 /g' prepare_input.sh
          ./prepare_input.sh

      - name: Cache YAML trace data
        uses: actions/cache@v4
        with:
          path: simulator/data/openb_pod_list_gpushare40
          key: ${{ runner.os }}-trace-yaml-${{ hashFiles('simulator/data/csv/openb_pod_list_gpushare40.csv') }}
          restore-keys: |
            ${{ runner.os }}-trace-yaml-

      - name: Install additional packages
        run: pip install pandas matplotlib numpy

      - name: Run ${{ matrix.policy }} experiment
        id: exp
        run: |
          cd simulator
          mkdir -p experiments/test_$(echo "${{ matrix.policy }}" | tr '[:upper:]' '[:lower:]')

          case "${{ matrix.policy }}" in
            FGD)
              echo "=== Running FGD (Fragmentation Gradient Descent) ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_fgd -e -b \
                -f data/openb_pod_list_gpushare40 \
                -FGD 1000 -gpusel FGD -dimext share -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_fgd/snapshot/ds01
              ;;
            BestFit)
              echo "=== Running BestFit (Classic Bin Packing) ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_bestfit -e -b \
                -f data/openb_pod_list_gpushare40 \
                -BestFit 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_bestfit/snapshot/ds01
              ;;
            DotProduct)
              echo "=== Running DotProduct (First-Fit Decreasing) ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_dotproduct -e -b \
                -f data/openb_pod_list_gpushare40 \
                -DotProd 1000 -gpusel best -dimext merge -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_dotproduct/snapshot/ds01
              ;;
            GpuPacking)
              echo "=== Running GpuPacking ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_gpupacking -e -b \
                -f data/openb_pod_list_gpushare40 \
                -GpuPacking 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_gpupacking/snapshot/ds01
              ;;
            GpuClustering)
              echo "=== Running GpuClustering ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_gpuclustering -e -b \
                -f data/openb_pod_list_gpushare40 \
                -GpuClustering 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_gpuclustering/snapshot/ds01
              ;;
            Random)
              echo "=== Running Random (Lower Bound Baseline) ==="
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_random -e -b \
                -f data/openb_pod_list_gpushare40 \
                -Random 1000 -gpusel random \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_random/snapshot/ds01
              ;;
          esac

      - name: Upload logs for ${{ matrix.policy }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.policy }}
          path: simulator/experiments/test_*/log-*.log
          if-no-files-found: ignore

  # ============================================================
  # H‑TAFM EXPERIMENTS (3 variants, run if enabled)
  # ============================================================
  run-htafm:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_htafm == 'true'
    strategy:
      matrix:
        policy:
          - HTAFM-Cut
          - HTAFM-Entropy
          - HTAFM-Hier
      fail-fast: false

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('simulator/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Clone and build simulator
        run: |
          git clone https://github.com/hkust-adsl/kubernetes-scheduler-simulator.git simulator
          cd simulator
          go mod vendor
          make
          chmod +x bin/simon

      - name: Install Python dependencies (simulator)
        run: |
          cd simulator
          pip install -r requirements.txt

      - name: Prepare trace data
        run: |
          cd simulator/data
          if [ ! -f csv/openb_pod_list_gpushare40.csv ]; then
            mkdir -p csv
            wget -P csv/ https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_node_list_gpu_node.csv
            wget -P csv/ https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_pod_list_gpushare40.csv
          fi
          chmod +x prepare_input.sh
          sed -i 's/python /python3 /g' prepare_input.sh
          ./prepare_input.sh

      - name: Cache YAML trace data
        uses: actions/cache@v4
        with:
          path: simulator/data/openb_pod_list_gpushare40
          key: ${{ runner.os }}-trace-yaml-${{ hashFiles('simulator/data/csv/openb_pod_list_gpushare40.csv') }}
          restore-keys: |
            ${{ runner.os }}-trace-yaml-

      - name: Install additional packages
        run: pip install pandas matplotlib numpy

      - name: Run ${{ matrix.policy }} experiment
        run: |
          cd simulator
          mkdir -p experiments/test_$(echo "${{ matrix.policy }}" | tr '[:upper:]' '[:lower:]')

          case "${{ matrix.policy }}" in
            HTAFM-Cut)
              echo "=== Running HTAFM-Cut (Cut-based fragmentation metric) ==="
              # ================================================================
              # TODO: Replace with actual H‑TAFM implementation.
              # For now, using FGD as a placeholder to keep the pipeline running.
              # Once H‑TAFM is implemented, replace the flags with:
              # -HTAFM 1000 -htafm-variant cut
              # ================================================================
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_htafm_cut -e -b \
                -f data/openb_pod_list_gpushare40 \
                -FGD 1000 -gpusel FGD -dimext share -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_htafm_cut/snapshot/ds01
              ;;
            HTAFM-Entropy)
              echo "=== Running HTAFM-Entropy (Entropy-based fragmentation metric) ==="
              # ================================================================
              # TODO: Replace with actual H‑TAFM implementation.
              # Once H‑TAFM is implemented, replace the flags with:
              # -HTAFM 1000 -htafm-variant entropy
              # ================================================================
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_htafm_entropy -e -b \
                -f data/openb_pod_list_gpushare40 \
                -FGD 1000 -gpusel FGD -dimext share -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_htafm_entropy/snapshot/ds01
              ;;
            HTAFM-Hier)
              echo "=== Running HTAFM-Hier (Hierarchical topology-aware fragmentation) ==="
              # ================================================================
              # TODO: Replace with actual H‑TAFM implementation.
              # Once H‑TAFM is implemented, replace the flags with:
              # -HTAFM 1000 -htafm-variant hierarchical
              # ================================================================
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_htafm_hier -e -b \
                -f data/openb_pod_list_gpushare40 \
                -FGD 1000 -gpusel FGD -dimext share -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_htafm_hier/snapshot/ds01
              ;;
          esac

      - name: Upload logs for ${{ matrix.policy }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.policy }}
          path: simulator/experiments/test_*/log-*.log
          if-no-files-found: ignore

  # ============================================================
  # AGGREGATE & COMMIT RESULTS
  # ============================================================
  aggregate-results:
    needs: [run-baseline, run-htafm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required packages
        run: pip install pandas matplotlib numpy

      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          path: all-logs

      - name: Organize logs for parsing
        run: |
          mkdir -p simulator/experiments
          for policy_dir in all-logs/*; do
            if [ -d "$policy_dir" ]; then
              cp -r "$policy_dir"/* simulator/experiments/ 2>/dev/null || true
            fi
          done

      - name: Parse results
        run: |
          cd simulator
          python3 ../scripts/parse_results.py --input-dir experiments --output-dir ../results

      - name: Generate README (complete overwrite)
        run: |
          cd simulator
          python3 ../scripts/update_readme.py --results-dir ../results --readme ../README.md

      - name: Upload aggregated results
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-results
          path: results/

      - name: Commit updated README and results using PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md results/
          git diff --staged --quiet || git commit -m "Auto-update experiment results [skip ci]"
          git push https://x-access-token:${PAT_TOKEN}@github.com/anuxlab/HTAFM_FGD_VMP.git HEAD:main || echo "Push failed; check PAT token permissions."