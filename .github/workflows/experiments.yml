name: VM Placement Experiments (Bin Packing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_htafm:
        description: 'Run H‑TAFM experiments (Cut, Entropy, Hierarchical)'
        type: boolean
        default: true

jobs:
  # ============================================================
  # BASELINE EXPERIMENTS (6 policies in parallel)
  # ============================================================
  run-baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [FGD, BestFit, DotProduct, GpuPacking, GpuClustering, Random]
      fail-fast: false
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('simulator/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Clone and build simulator (from fork) with verbose logs
        id: build
        run: |
          set -x
          git clone https://github.com/anuxlab/anu_kubernetes-scheduler-simulator.git simulator
          cd simulator
          make -v 2>&1 | tee build.log
          chmod +x bin/simon
          # Verify binary exists
          ls -la bin/
          # Check if HTAFM plugin is compiled (look for symbol in binary)
          go version -m bin/simon | grep -i htafm || echo "HTAFM plugin not found in binary"
        continue-on-error: false

      - name: Upload build log (baseline)
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.policy }}
          path: simulator/build.log
          if-no-files-found: ignore

      - name: Install simulator Python dependencies
        run: |
          cd simulator
          pip install -r requirements.txt

      - name: Install additional Python packages (for parsing)
        run: pip install pandas matplotlib numpy

      - name: Run ${{ matrix.policy }} experiment with verbose output
        id: exp
        run: |
          set -x
          cd simulator
          mkdir -p experiments/test_$(echo "${{ matrix.policy }}" | tr '[:upper:]' '[:lower:]')
          case "${{ matrix.policy }}" in
            FGD)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_fgd -e -b -f data/openb_pod_list_gpushare40 \
                -FGD 1000 -gpusel FGD -dimext share -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_fgd/snapshot/ds01 2>&1 | tee experiments/test_fgd/terminal.out
              ;;
            BestFit)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_bestfit -e -b -f data/openb_pod_list_gpushare40 \
                -BestFit 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_bestfit/snapshot/ds01 2>&1 | tee experiments/test_bestfit/terminal.out
              ;;
            DotProduct)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_dotproduct -e -b -f data/openb_pod_list_gpushare40 \
                -DotProd 1000 -gpusel best -dimext merge -norm max \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_dotproduct/snapshot/ds01 2>&1 | tee experiments/test_dotproduct/terminal.out
              ;;
            GpuPacking)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_gpupacking -e -b -f data/openb_pod_list_gpushare40 \
                -GpuPacking 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_gpupacking/snapshot/ds01 2>&1 | tee experiments/test_gpupacking/terminal.out
              ;;
            GpuClustering)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_gpuclustering -e -b -f data/openb_pod_list_gpushare40 \
                -GpuClustering 1000 \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_gpuclustering/snapshot/ds01 2>&1 | tee experiments/test_gpuclustering/terminal.out
              ;;
            Random)
              python3 scripts/generate_config_and_run.py \
                -d experiments/test_random -e -b -f data/openb_pod_list_gpushare40 \
                -Random 1000 -gpusel random \
                -tune 1.3 -tuneseed 50 --shuffle-pod=true \
                -z experiments/test_random/snapshot/ds01 2>&1 | tee experiments/test_random/terminal.out
              ;;
          esac

      - name: Upload logs for ${{ matrix.policy }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.policy }}
          path: |
            simulator/experiments/test_*/log-*.log
            simulator/experiments/test_*/terminal.out
          if-no-files-found: ignore

      - name: Upload cluster config (only for Random)
        if: matrix.policy == 'Random'
        uses: actions/upload-artifact@v4
        with:
          name: cluster-config
          path: simulator/experiments/test_random/cc_*.yaml

  # ============================================================
  # H‑TAFM EXPERIMENTS (3 variants with fallback and debug)
  # ============================================================
  run-htafm:
    runs-on: ubuntu-latest
    # if: github.event.inputs.run_htafm == 'true'
    strategy:
      matrix:
        variant: [cut, entropy, hier]
      fail-fast: false
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('simulator/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Clone and build simulator with verbose logging
        id: build_htafm
        run: |
          set -x
          git clone https://github.com/anuxlab/anu_kubernetes-scheduler-simulator.git simulator
          cd simulator
          make -v 2>&1 | tee build.log
          chmod +x bin/simon
          ls -la bin/
          go version -m bin/simon | grep -i htafm || echo "HTAFM plugin not found in binary"
        continue-on-error: false

      - name: Upload build log (htafm)
        uses: actions/upload-artifact@v4
        with:
          name: build-log-htafm-${{ matrix.variant }}
          path: simulator/build.log
          if-no-files-found: ignore

      - name: Install simulator Python dependencies
        run: |
          cd simulator
          pip install -r requirements.txt

      - name: Install additional Python packages
        run: pip install pandas matplotlib numpy

      # Download cluster config from artifact (if available) OR use fallback
      - name: Download cluster config from baseline Random (attempt)
        uses: actions/download-artifact@v4
        with:
          name: cluster-config
          path: cluster-config
        continue-on-error: true

      - name: Prepare final cluster config (artifact or fallback) with debug
        id: prep-config
        run: |
          set -x
          mkdir -p simulator/cluster-config
          echo "Checking for artifact..."
          if [ -d cluster-config ] && [ -f cluster-config/cc_*.yaml ]; then
            echo "✅ Using cluster config from artifact."
            cp cluster-config/cc_*.yaml simulator/cluster-config/cluster-config.yaml
            ls -la simulator/cluster-config/
          elif [ -f data/cluster_configs/cc_*.yaml ]; then
            echo "ℹ️ Artifact not found. Using fallback from data/cluster_configs/"
            cp data/cluster_configs/cc_*.yaml simulator/cluster-config/cluster-config.yaml
            ls -la simulator/cluster-config/
          else
            echo "❌ No cluster config found! Please either:"
            echo "   - Run the baseline Random experiment to generate the artifact, or"
            echo "   - Place a fallback file at data/cluster_configs/cc_*.yaml"
            exit 1
          fi

          echo "CLUSTER_CONFIG=cluster-config/cluster-config.yaml" >> $GITHUB_ENV
          echo "✅ Cluster config ready"
          # Print content of cluster config for debugging
          cat simulator/cluster-config/cluster-config.yaml

      - name: Run HTAFM-${{ matrix.variant }} with full debug output
        id: run_htafm
        run: |
          set -x
          cd simulator
          EXP_DIR="experiments/test_htafm_${{ matrix.variant }}"
          mkdir -p ${EXP_DIR}

          cat > ${EXP_DIR}/scheduler-config.yaml << EOF
          apiVersion: kubescheduler.config.k8s.io/v1beta1
          kind: KubeSchedulerConfiguration
          percentageOfNodesToScore: 100
          profiles:
          - pluginConfig:
            - args:
                variant: ${{ matrix.variant }}
              name: HTAFMScore
            plugins:
              score:
                disabled:
                - name: FGDScore
                - name: DotProductScore
                - name: GpuClusteringScore
                - name: GpuPackingScore
                - name: BestFitScore
                - name: RandomScore
                enabled:
                - name: HTAFMScore
                  weight: 1000
            schedulerName: simon-scheduler
          EOF

          # Print scheduler config for debugging
          echo "--- Scheduler config ---"
          cat ${EXP_DIR}/scheduler-config.yaml
          echo "--- End scheduler config ---"

          LOG_FILE="${EXP_DIR}/log-htafm-${{ matrix.variant }}.log"
          # Run with verbose and capture both stdout and stderr
          ./bin/simon apply --extended-resources "gpu" \
            -f ${{ env.CLUSTER_CONFIG }} \
            --default-scheduler-config ${EXP_DIR}/scheduler-config.yaml \
            2>&1 | tee ${LOG_FILE}

          # Also store the exit code
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE" >> ${LOG_FILE}

          # If log file is empty, print error
          if [ ! -s ${LOG_FILE} ]; then
            echo "⚠️ Warning: Log file is empty. Simulation may have failed."
            echo "Please check the runner logs for detailed output."
          else
            echo "✅ Log file created: ${LOG_FILE}"
            # Print last 50 lines for quick check
            echo "--- Last 50 lines of log ---"
            tail -50 ${LOG_FILE}
          fi

          # Exit with the simon exit code
          exit $EXIT_CODE

      - name: Upload logs for HTAFM-${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-HTAFM-${{ matrix.variant }}
          path: |
            simulator/experiments/test_htafm_*/log-*.log
            simulator/experiments/test_htafm_*/scheduler-config.yaml
          if-no-files-found: ignore

  # ============================================================
  # AGGREGATE & COMMIT RESULTS (with all logs)
  # ============================================================
  aggregate-results:
    needs: [run-baseline, run-htafm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required packages
        run: pip install pandas matplotlib numpy

      - name: Download all logs and artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-logs

      - name: Organise logs for parsing and debug
        run: |
          mkdir -p simulator/experiments
          # Copy all log files to experiments directory
          for policy_dir in all-logs/*; do
            if [ -d "$policy_dir" ]; then
              cp -r "$policy_dir"/* simulator/experiments/ 2>/dev/null || true
            fi
          done
          # Also copy build logs for debugging
          mkdir -p build-logs
          find all-logs -name "build.log" -exec cp {} build-logs/ \;

      - name: Parse results (if any)
        id: parse
        continue-on-error: true
        run: |
          cd simulator
          python3 ../scripts/parse_results.py --input-dir experiments --output-dir ../results

      - name: Generate README (complete overwrite)
        run: |
          cd simulator
          python3 ../scripts/update_readme.py --results-dir ../results --readme ../README.md

      - name: Upload aggregated results
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-results
          path: |
            results/
            build-logs/
            all-logs/

      - name: Commit updated README, results, and debug logs
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Add all new/changed files
          git add README.md results/ build-logs/ all-logs/
          git diff --staged --quiet || git commit -m "Auto-update experiment results and debug logs [skip ci]"
          git push https://x-access-token:${PAT_TOKEN}@github.com/anuxlab/HTAFM_FGD_VMP.git HEAD:main || echo "Push failed; check PAT token permissions."