name: VM Placement Experiments (Bin Packing)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger
    inputs:
      run_baselines:
        description: 'Run baseline experiments (FGD, BestFit, Random)'
        type: boolean
        default: true
      run_htafm:
        description: 'Run H-TAFM experiments'
        type: boolean
        default: false

jobs:
  run-experiments:
    name: Run VM Placement Experiments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Kubernetes Scheduler Simulator
        run: |
          git clone https://github.com/hkust-adsl/kubernetes-scheduler-simulator.git simulator
          cd simulator
          go mod vendor
          make

      - name: Prepare trace data
        run: |
          cd simulator/data
          wget -q https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_node_list_gpu_node.csv
          wget -q https://raw.githubusercontent.com/alibaba/clusterdata/master/cluster-trace-gpu-v2025/openb_pod_list_gpushare40.csv
          ./prepare_input.sh
          ls -la

      - name: Install Python dependencies
        run: |
          pip install pandas matplotlib numpy

      - name: Run baseline experiments
        if: github.event.inputs.run_baselines != 'false'
        run: |
          cd simulator
          mkdir -p experiments

          # FGD
          python3 scripts/generate_config_and_run.py \
            -d experiments/test_fgd \
            -e -b \
            -f data/openb_pod_list_gpushare40 \
            -FGD 1000 \
            -gpusel FGD \
            -dimext share \
            -norm max \
            -tune 1.3 \
            -tuneseed 50 \
            --shuffle-pod=true \
            -z experiments/test_fgd/snapshot/ds01

          # BestFit
          python3 scripts/generate_config_and_run.py \
            -d experiments/test_bestfit \
            -e -b \
            -f data/openb_pod_list_gpushare40 \
            -BestFit 1000 \
            -tune 1.3 \
            -tuneseed 50 \
            --shuffle-pod=true \
            -z experiments/test_bestfit/snapshot/ds01

          # Random
          python3 scripts/generate_config_and_run.py \
            -d experiments/test_random \
            -e -b \
            -f data/openb_pod_list_gpushare40 \
            -Random 1000 \
            -gpusel random \
            -tune 1.3 \
            -tuneseed 50 \
            --shuffle-pod=true \
            -z experiments/test_random/snapshot/ds01

      - name: Parse results
        run: |
          cd simulator
          python3 ../scripts/parse_results.py --input-dir experiments --output-dir ../results

      - name: Generate summary tables
        run: |
          cd simulator
          python3 ../scripts/update_readme.py --results-dir ../results --readme ../README.md

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            results/
            simulator/experiments/*/analysis_*.csv
            simulator/experiments/*/log-*.log

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add results/ README.md
          git diff --staged --quiet || git commit -m "Auto-update experiment results [skip ci]"
          git push || echo "No changes to push"